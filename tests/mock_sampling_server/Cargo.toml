[package]
name = "mock_sampling_server"
version = "0.1.0"
edition = "2021"

[dependencies]
rmcp = { version = "0.8.5", features = ["transport-child-process", "transport-io", "server", "client"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.1"
anyhow = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = "0.3"
