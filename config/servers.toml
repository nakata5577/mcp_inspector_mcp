# MCP Inspector Server Configuration
#
# This file defines the MCP servers that can be inspected.
# Each server configuration specifies how to connect to and communicate with the target server.

# Example: Filesystem MCP Server
# Uncomment and adjust the path as needed
# [[servers]]
# name = "filesystem"
# transport = "stdio"
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-filesystem", "/path/to/allowed/directory"]
# [servers.env]
# # Optional environment variables

# Example: GitHub MCP Server
# Requires GITHUB_TOKEN environment variable
# [[servers]]
# name = "github"
# transport = "stdio"
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-github"]
# [servers.env]
# # GITHUB_TOKEN will be inherited from the parent process

# Example: Custom Rust MCP Server
# [[servers]]
# name = "my-rust-server"
# transport = "stdio"
# command = "tests/mock_sampling_server/target/release/mock_sampling_server.exe"
# args = ["run", "--release"]
# [servers.env]
# MY_ENV_VAR = "value"

# For testing with the fundamental_analysis MCP server in the parent directory
# Using pre-built binary for faster startup
[[servers]]
name = "fundamental_analysis"
transport = "stdio"
command = "C:/Users/takah/work/my_mcp_server/fundamental_analysis/target/release/fundamental_analysis.exe"
args = []

[servers.env]
# Add any required environment variables here

# Mock Sampling Server for testing MonitoringTransport
[[servers]]
name = "mock_sampling"
transport = "stdio"
command = "C:/Users/takah/work/my_mcp_server/mcp_inspector_mcp/tests/mock_sampling_server/target/release/mock_sampling_server.exe"
args = []

[servers.env]
# No environment variables required for mock server

# Logging Configuration (Phase 5)
[logging]
# Backend type: "memory" or "persistent"
# - memory: In-memory storage (data lost on restart)
# - persistent: Disk-based storage using sled (data survives restart)
backend = "persistent"

# Database path for persistent backend (optional, only used if backend = "persistent")
db_path = "./data/logs.db"

# Maximum number of logs per server (optional, default: 10000)
max_logs = 10000
