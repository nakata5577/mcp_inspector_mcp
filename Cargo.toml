[package]
name = "mcp_inspector_mcp"
version = "0.2.0"
edition = "2021"

[dependencies]
rmcp = { version = "0.8.5", features = ["transport-child-process", "transport-io", "client"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-json-schema = "0.1"
schemars = "1.1"
anyhow = "1"
thiserror = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = { version = "0.4.42", features = ["serde"] }
sled = "0.34"
bincode = "1.3"

[dev-dependencies]
tempfile = "3"
