[package]
name = "mcp_inspector_mcp"
version = "0.4.0"
edition = "2021"

[dependencies]
rmcp = { version = "0.8.5", features = ["transport-child-process", "transport-io", "client"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-json-schema = "0.1"
schemars = "1.1"
anyhow = "1"
thiserror = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
chrono = { version = "0.4.42", features = ["serde"] }
sled = "0.34"
bincode = "1.3"
colored = "2"
once_cell = "1"
clap = { version = "4", features = ["derive"] }
# Task 3.2: Batch Testing
serde_yaml = "0.9"
quick-xml = "0.31"
prettytable-rs = "0.10"
jsonpath_lib = "0.3"
# Task 3.4: Performance Monitoring
hdrhistogram = "7"
sysinfo = "0.30"
# Task 3.5: Configuration Management
similar = "2"

[dev-dependencies]
tempfile = "3"
serial_test = "3"
